<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Our Community</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101114;
      color: #f5f5f5;
    }

    header {
      padding: 18px;
      background: #191a20;
      border-bottom: 1px solid #303139;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      color: #aaa;
      margin-bottom: 0;
    }

    main {
      width: min(700px, 94%);
      margin: 24px auto;
    }

    .card {
      background: #191a20;
      border: 1px solid #303139;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #41424b;
      background: #101114;
      color: white;
      font: inherit;
    }

    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 9px;
      background: #7357ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .post-button {
      margin-top: 10px;
    }

    .post {
      border-top: 1px solid #303139;
      padding-top: 14px;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .post small {
      color: #aaa;
    }

    .like-button {
      background: #303139;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 25px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="brand">Our Community</h1>
    <p>A place for people, creators, and businesses.</p>
  </header>

  <main>
    <section class="card">
      <h2>Share something</h2>
      <form id="post-form">
        <textarea id="post-text" maxlength="1000"
          placeholder="What's on your mind?"></textarea>
        <button class="post-button" type="submit">Create post</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Community feed</h2>
      <div id="feed">
        <p id="empty-message">Your community starts here. Create the first post!</p>
      </div>
    </section>
  </main>

  <footer>Our Community · A new beginning</footer>

  <script>
    const form = document.getElementById("post-form");
    const input = document.getElementById("post-text");
    const feed = document.getElementById("feed");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = input.value.trim();

      if (!text) {
        message.textContent = "Please write something before posting.";
        return;
      }

      const emptyMessage = document.getElementById("empty-message");
      if (emptyMessage) emptyMessage.remove();

      const post = document.createElement("article");
      post.className = "post";

      const content = document.createElement("p");
      content.textContent = text;

      const date = document.createElement("small");
      date.textContent = "Just now · Local preview";

      const likeButton = document.createElement("button");
      likeButton.className = "like-button";
      likeButton.textContent = "♥ Like (0)";
      let likes = 0;

      likeButton.addEventListener("click", function () {
        likes++;
        likeButton.textContent = "♥ Like (" + likes + ")";
      });

      post.append(content, date, document.createElement("br"), likeButton);
      feed.prepend(post);

      input.value = "";
      message.textContent = "Your post was added to this preview.";
    });
  </script>
</body>
  </html>
